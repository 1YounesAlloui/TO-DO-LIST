{% load static %}
<!DOCTYPE html>
<html lang="en" class="theme-mountain-dawn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My To‑Do App{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom styles (themes + layout) -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    {% block extra_head %}{% endblock %}
</head>
<body>

    <!-- Floating CSS Orbs Background -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- Main Content Area -->
    <div class="main-content">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Centered Pill Bottom Navigation -->
    <div class="bottom-bar" id="bottomNavBar">
        <!-- Home -->
        <a class="bar-icon {% if active_page == 'home' %}active{% endif %}"
           href="{% url 'home' %}">
            <i class="fas fa-home"></i>
        </a>
        <!-- To‑Do List -->
        <a class="bar-icon {% if active_page == 'todo-list' %}active{% endif %}"
           href="{% url 'todo-list' %}">
            <i class="fas fa-tasks"></i>
        </a>
        <!-- Calendar -->
        <a class="bar-icon {% if active_page == 'calendar' %}active{% endif %}"
           href="{% url 'calendar' %}">
            <i class="fas fa-calendar-alt"></i>
        </a>
        <!-- Theme Switcher -->
        <button class="bar-icon theme-switcher-btn" id="themeSwitcherBtn" title="Change theme">
            <i class="fas fa-palette"></i>
        </button>
        <!-- Theme popover (hidden by default) -->
        <div class="theme-popover" id="themePopover">
            <div class="theme-option" data-theme="theme-mountain-dawn">
                <span class="theme-swatch" style="background:#FDBA74; border-color: #1B2431;"></span> Mountain Dawn
            </div>
            <div class="theme-option" data-theme="theme-ocean-horizon">
                <span class="theme-swatch" style="background:#22D3EE; border-color: #082F49;"></span> Ocean Horizon
            </div>
            <div class="theme-option" data-theme="theme-desert-canyon">
                <span class="theme-swatch" style="background:#FB923C; border-color: #2C130D;"></span> Desert Canyon
            </div>
            <div class="theme-option" data-theme="theme-forest-sanctuary">
                <span class="theme-swatch" style="background:#10B981; border-color: #064E3B;"></span> Forest Sanctuary
            </div>
            <div class="theme-option" data-theme="theme-sunset-highlands">
                <span class="theme-swatch" style="background:#F472B6; border-color: #2E1029;"></span> Sunset Highlands
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom theme switcher script -->
    <script src="{% static 'js/style.js' %}"></script>

    {% block extra_scripts %}{% endblock %}

    <!-- Draggable Bottom Bar Script -->
    <script>
        (function() {
            const bar = document.getElementById('bottomNavBar');
            if (!bar) return;

            let isDragging = false;
            let startX, startY, initialLeft, initialTop;
            let hasMoved = false;  // to distinguish click from drag

            function getBarRect() {
                const rect = bar.getBoundingClientRect();
                return { left: rect.left, top: rect.top };
            }

            function onPointerDown(e) {
                // Only allow dragging if the target is the bar itself (not a link/button)
                const target = e.target;
                if (target.closest('a, button')) {
                    return;
                }

                e.preventDefault();
                isDragging = true;
                hasMoved = false;

                const point = e.touches ? e.touches[0] : e;
                startX = point.clientX;
                startY = point.clientY;

                const initial = getBarRect();
                initialLeft = initial.left;
                initialTop = initial.top;

                // Remove transition and center offset while dragging
                bar.style.transition = 'none';
                bar.style.transform = 'none';
                bar.style.left = initialLeft + 'px';
                bar.style.top = initialTop + 'px';
                bar.style.bottom = 'auto';
                bar.setPointerCapture(e.pointerId || 0);
                bar.style.cursor = 'grabbing';
            }

            function onPointerMove(e) {
                if (!isDragging) return;
                e.preventDefault();
                const point = e.touches ? e.touches[0] : e;
                const dx = point.clientX - startX;
                const dy = point.clientY - startY;

                if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
                    hasMoved = true;
                }

                bar.style.left = (initialLeft + dx) + 'px';
                bar.style.top = (initialTop + dy) + 'px';
            }

            function onPointerUp(e) {
                if (!isDragging) return;
                isDragging = false;
                bar.style.cursor = 'grab';

                // Restore transition after dragging
                setTimeout(() => {
                    bar.style.transition = '';
                }, 50);

                // Prevent accidental link/button clicks after a drag
                if (hasMoved) {
                    e.preventDefault();
                    e.stopPropagation();
                }
            }

            // Initial style
            bar.style.cursor = 'grab';

            // Attach events
            bar.addEventListener('mousedown', onPointerDown);
            bar.addEventListener('touchstart', onPointerDown, { passive: false });
            document.addEventListener('mousemove', onPointerMove);
            document.addEventListener('touchmove', onPointerMove, { passive: false });
            document.addEventListener('mouseup', onPointerUp);
            document.addEventListener('touchend', onPointerUp);

            // Prevent default click actions on the bar when dragging ends
            bar.addEventListener('click', function(e) {
                if (hasMoved) {
                    e.preventDefault();
                    e.stopPropagation();
                }
            }, true);
        })();
    </script>
</body>
</html>
